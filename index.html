<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Grind</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh;-webkit-tap-highlight-color:transparent}
        .container{max-width:600px;margin:0 auto;padding:16px;padding-bottom:80px}
        .header{text-align:center;padding:20px 0 10px}
        .header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#00d4ff,#7b2fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header .day-name{font-size:17px;color:#888;font-weight:600;margin-top:4px}
        .header .date{color:#555;font-size:12px;margin-top:2px}
        .streak-bar{display:flex;justify-content:center;gap:20px;margin-top:14px;padding:12px;background:#14141f;border-radius:14px;border:1px solid #1e1e30}
        .streak-item{text-align:center}
        .streak-num{font-size:20px;font-weight:800;background:linear-gradient(135deg,#00d4ff,#7b2fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .streak-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
        .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
        .card{background:#14141f;border:1px solid #1e1e30;border-radius:14px;padding:16px;cursor:pointer;transition:all .2s}
        .card:active{transform:scale(.97)}
        .card .icon{font-size:26px;margin-bottom:8px}
        .card .card-title{font-size:14px;font-weight:700;margin-bottom:2px}
        .card .card-subtitle{font-size:11px;color:#555}
        .card .progress-bar{margin-top:8px;height:4px;background:#1e1e30;border-radius:2px;overflow:hidden}
        .card .progress-bar .fill{height:100%;border-radius:2px;transition:width .5s}
        .card-morning{border-left:3px solid #ff9a56}.card-morning .fill{background:linear-gradient(90deg,#ff9a56,#ff6b6b)}
        .card-workout{border-left:3px solid #00d4ff}.card-workout .fill{background:linear-gradient(90deg,#00d4ff,#7b2fff)}
        .card-daily{border-left:3px solid #56ab2f}.card-daily .fill{background:linear-gradient(90deg,#56ab2f,#a8e063)}
        .card-night{border-left:3px solid #6441a5}.card-night .fill{background:linear-gradient(90deg,#6441a5,#2a0845)}
        .card-goals{border-left:3px solid #ffd700}.card-goals .fill{background:linear-gradient(90deg,#ffd700,#ffaa00)}
        .card-stats{border-left:3px solid #ff6b9d}.card-stats .fill{background:linear-gradient(90deg,#ff6b9d,#c44dff)}
        .detail-view{display:none}
        .detail-view.active{display:block;animation:slideIn .25s ease}
        @keyframes slideIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#00d4ff;font-size:14px;cursor:pointer;padding:8px 0;font-weight:600}
        .detail-title{font-size:22px;font-weight:800;margin:8px 0 16px}
        .checklist{list-style:none}
        .checklist li{background:#14141f;border:1px solid #1e1e30;border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s}
        .checklist li.checked{opacity:.35}
        .checklist li.checked .task-text{text-decoration:line-through}
        .checkbox{width:20px;height:20px;border:2px solid #333;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:12px;color:transparent}
        .checklist li.checked .checkbox{background:#00d4ff;border-color:#00d4ff;color:#0a0a0f}
        .task-text{flex:1;font-size:14px}
        .task-time{color:#555;font-size:11px;flex-shrink:0}
        .workout-exercise{background:#14141f;border:1px solid #1e1e30;border-radius:12px;padding:14px;margin-bottom:8px}
        .exercise-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .exercise-name{font-weight:700;font-size:14px}
        .muscle-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:#1e1e30;color:#00d4ff}
        .sets-header{display:grid;grid-template-columns:32px 1fr 1fr 36px;gap:6px;font-size:10px;color:#444;text-transform:uppercase;margin-bottom:4px;text-align:center}
        .sets-grid{display:grid;grid-template-columns:32px 1fr 1fr 36px;gap:6px;align-items:center;margin-bottom:4px}
        .set-label{color:#555;font-size:12px;text-align:center}
        .sets-grid input{background:#0a0a0f;border:1px solid #1e1e30;border-radius:6px;color:#fff;padding:7px 6px;font-size:13px;text-align:center;width:100%}
        .sets-grid input:focus{outline:none;border-color:#00d4ff}
        .set-check{width:32px;height:32px;border:2px solid #333;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:none;color:transparent;font-size:14px;transition:all .15s;margin:0 auto}
        .set-check.done{background:#00d4ff;border-color:#00d4ff;color:#0a0a0f}
        .nav-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
        .nav-tabs::-webkit-scrollbar{display:none}
        .nav-tab{padding:6px 12px;background:#14141f;border:1px solid #1e1e30;border-radius:20px;color:#555;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s}
        .nav-tab.active{background:#00d4ff;color:#0a0a0f;font-weight:700;border-color:#00d4ff}
        .icon-btn{background:#1e1e30;border:none;color:#888;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
        .icon-btn:hover{background:#2a2a45;color:#fff}
        .icon-btn.active-edit{background:#00d4ff;color:#0a0a0f}
        .edit-item-row{background:#14141f;border:1px solid #1e1e30;border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;animation:slideIn .2s}
        .edit-item-row .edit-inputs{flex:1;display:flex;gap:6px}
        .edit-item-row .edit-inputs input{background:#0a0a0f;border:1px solid #1e1e30;border-radius:6px;color:#fff;padding:8px 10px;font-size:13px;font-family:inherit}
        .edit-item-row .edit-inputs input:focus{outline:none;border-color:#00d4ff}
        .edit-item-row .edit-inputs .input-task{flex:1}
        .edit-item-row .edit-inputs .input-time{width:70px;text-align:center}
        .delete-item-btn{background:none;border:none;color:#444;cursor:pointer;font-size:16px;padding:4px;transition:color .15s;flex-shrink:0}
        .delete-item-btn:hover{color:#ff4757}
        .edit-exercise-card{background:#14141f;border:1px solid #1e1e30;border-radius:12px;padding:12px;margin-bottom:8px;animation:slideIn .2s}
        .edit-exercise-card .ex-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
        .edit-exercise-card input{background:#0a0a0f;border:1px solid #1e1e30;border-radius:6px;color:#fff;padding:8px 10px;font-size:13px;font-family:inherit}
        .edit-exercise-card input:focus{outline:none;border-color:#00d4ff}
        .edit-exercise-card .ex-name{flex:1}
        .edit-exercise-card .ex-muscle{width:100px}
        .edit-exercise-card .ex-sets{width:55px;text-align:center}
        .edit-exercise-card .ex-reps{width:70px;text-align:center}
        .add-btn{width:100%;padding:12px;background:#0a0a0f;border:2px dashed #1e1e30;border-radius:12px;color:#555;font-size:14px;cursor:pointer;transition:all .2s;font-family:inherit;margin-bottom:8px}
        .add-btn:hover{border-color:#00d4ff;color:#00d4ff}
        .btn-save-all{width:100%;padding:14px;background:linear-gradient(135deg,#00d4ff,#7b2fff);color:#fff;font-size:15px;font-weight:700;border:none;border-radius:12px;cursor:pointer;margin-top:12px;transition:all .2s;font-family:inherit}
        .btn-save-all:hover{transform:scale(1.01);box-shadow:0 4px 20px rgba(0,212,255,.3)}
        .mode-label{text-align:center;padding:8px;background:linear-gradient(135deg,#00d4ff22,#7b2fff22);border-radius:8px;font-size:12px;color:#00d4ff;font-weight:600;margin-bottom:12px}
        .workout-name-input{width:100%;background:#0a0a0f;border:1px solid #1e1e30;border-radius:10px;color:#fff;padding:12px 14px;font-size:15px;font-weight:600;font-family:inherit;margin-bottom:12px}
        .workout-name-input:focus{outline:none;border-color:#00d4ff}
        .empty-state{text-align:center;padding:30px;color:#444;font-size:14px}
        .log-section{margin-top:25px;padding-top:18px;border-top:1px solid #1e1e30}
        .log-section h3{font-size:15px;margin-bottom:10px;color:#666}
        .log-entry{background:#14141f;border:1px solid #1e1e30;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:12px}
        .log-date{color:#00d4ff;font-weight:600;margin-bottom:3px}
        .log-detail{color:#666;line-height:1.4}
        .daily-reset{text-align:center;margin-top:20px}
        .reset-btn{background:none;border:1px solid #1e1e30;color:#444;padding:8px 18px;border-radius:10px;cursor:pointer;font-size:12px;font-family:inherit}
        .reset-btn:hover{border-color:#ff6b6b;color:#ff6b6b}
        .water-tracker{background:#14141f;border:1px solid #1e1e30;border-radius:14px;padding:16px;margin-bottom:14px;text-align:center}
        .water-tracker .water-title{font-size:14px;font-weight:700;margin-bottom:4px;color:#00d4ff}
        .water-tracker .water-sub{font-size:12px;color:#555;margin-bottom:12px}
        .water-glasses{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
        .water-glass{font-size:28px;cursor:pointer;transition:all .15s;opacity:.25;filter:grayscale(1)}
        .water-glass.filled{opacity:1;filter:grayscale(0)}
        .water-glass:active{transform:scale(1.2)}
        .water-count{font-size:13px;color:#888;margin-top:8px}
        .mood-tracker{background:#14141f;border:1px solid #1e1e30;border-radius:14px;padding:16px;margin-bottom:14px;text-align:center}
        .mood-tracker .mood-title{font-size:14px;font-weight:700;margin-bottom:10px}
        .mood-emojis{display:flex;justify-content:center;gap:12px}
        .mood-emoji{font-size:30px;cursor:pointer;opacity:.3;transition:all .15s;padding:4px}
        .mood-emoji.selected{opacity:1;transform:scale(1.2)}
        .mood-emoji:active{transform:scale(1.3)}
        .sleep-log{background:#14141f;border:1px solid #1e1e30;border-radius:14px;padding:16px;margin-bottom:14px}
        .sleep-log .sleep-title{font-size:14px;font-weight:700;margin-bottom:12px;color:#6441a5}
        .sleep-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
        .sleep-row label{font-size:13px;color:#888;width:80px;flex-shrink:0}
        .sleep-row input[type=number]{background:#0a0a0f;border:1px solid #1e1e30;border-radius:8px;color:#fff;padding:8px 12px;font-size:14px;width:70px;text-align:center;font-family:inherit}
        .sleep-row input:focus{outline:none;border-color:#6441a5}
        .sleep-stars{display:flex;gap:4px}
        .sleep-star{font-size:22px;cursor:pointer;opacity:.25;transition:all .15s}
        .sleep-star.active{opacity:1}
        .goal-section{margin-bottom:20px}
        .goal-section h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
        .goal-item{background:#14141f;border:1px solid #1e1e30;border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
        .goal-item.done{opacity:.4}
        .goal-item.done .goal-text{text-decoration:line-through}
        .goal-text{flex:1;font-size:14px}
        .goal-input{flex:1;background:#0a0a0f;border:1px solid #1e1e30;border-radius:6px;color:#fff;padding:8px 10px;font-size:13px;font-family:inherit}
        .goal-input:focus{outline:none;border-color:#ffd700}
        .stat-card{background:#14141f;border:1px solid #1e1e30;border-radius:12px;padding:16px;margin-bottom:10px}
        .stat-card h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
        .stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e1e30;font-size:13px}
        .stat-row:last-child{border:none}
        .stat-row .stat-date{color:#888}
        .stat-row .stat-val{color:#00d4ff;font-weight:600}
        .stat-big{display:flex;justify-content:center;gap:24px;margin-bottom:16px}
        .stat-big-item{text-align:center}
        .stat-big-num{font-size:28px;font-weight:800;background:linear-gradient(135deg,#00d4ff,#7b2fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .stat-big-label{font-size:11px;color:#555;margin-top:2px}
        .pr-section{margin-top:20px;padding-top:16px;border-top:1px solid #1e1e30}
        .pr-section h3{font-size:15px;margin-bottom:10px;color:#ffd700;display:flex;align-items:center;gap:8px}
        .pr-item{background:#14141f;border:1px solid #1e1e30;border-radius:10px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
        .pr-name{font-weight:600;font-size:14px}
        .pr-weight{color:#ffd700;font-weight:700;font-size:15px}
        .pr-form{display:flex;gap:6px;margin-bottom:10px}
        .pr-form input{background:#0a0a0f;border:1px solid #1e1e30;border-radius:8px;color:#fff;padding:8px 10px;font-size:13px;font-family:inherit}
        .pr-form input:focus{outline:none;border-color:#ffd700}
        .pr-form .pr-ex-input{flex:1}
        .pr-form .pr-kg-input{width:70px;text-align:center}
        .pr-add-btn{background:#ffd700;color:#0a0a0f;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
        .schedule-banner{background:linear-gradient(135deg,#00d4ff15,#7b2fff15);border:1px solid #1e1e30;border-radius:12px;padding:14px;margin-bottom:14px;text-align:center}
        .schedule-banner .sched-title{font-size:13px;font-weight:700;color:#00d4ff;margin-bottom:4px}
        .schedule-banner .sched-items{font-size:13px;color:#999;line-height:1.6}
        .schedule-banner .sched-time{color:#00d4ff;font-weight:600}
    </style>
</head>
<body>
<div class="container">
    <div id="dashboard">
        <div class="header">
            <h1>DAILY GRIND</h1>
            <div class="day-name" id="dayName"></div>
            <div class="date" id="currentDate"></div>
        </div>
        <div id="scheduleBanner"></div>
        <div class="streak-bar">
            <div class="streak-item"><div class="streak-num" id="streakCount">0</div><div class="streak-label">Streak</div></div>
            <div class="streak-item"><div class="streak-num" id="totalWorkouts">0</div><div class="streak-label">Workouts</div></div>
            <div class="streak-item"><div class="streak-num" id="todayProgress">0%</div><div class="streak-label">Today</div></div>
        </div>
        <div class="cards-grid">
            <div class="card card-morning" onclick="showDetail('morning')"><div class="icon">🌅</div><div class="card-title">Morning</div><div class="card-subtitle" id="morningStatus">0/0</div><div class="progress-bar"><div class="fill" id="morningProgress" style="width:0%"></div></div></div>
            <div class="card card-workout" onclick="showDetail('workout')"><div class="icon">💪</div><div class="card-title">Workout</div><div class="card-subtitle" id="workoutStatus">-</div><div class="progress-bar"><div class="fill" id="workoutProgress" style="width:0%"></div></div></div>
            <div class="card card-daily" onclick="showDetail('daily')"><div class="icon">📋</div><div class="card-title">Daily</div><div class="card-subtitle" id="dailyStatus">0/0</div><div class="progress-bar"><div class="fill" id="dailyProgress" style="width:0%"></div></div></div>
            <div class="card card-night" onclick="showDetail('night')"><div class="icon">🌙</div><div class="card-title">Night</div><div class="card-subtitle" id="nightStatus">0/0</div><div class="progress-bar"><div class="fill" id="nightProgress" style="width:0%"></div></div></div>
            <div class="card card-goals" onclick="showDetail('goals')"><div class="icon">🎯</div><div class="card-title">Goals</div><div class="card-subtitle" id="goalsStatus">0/0</div><div class="progress-bar"><div class="fill" id="goalsProgress" style="width:0%"></div></div></div>
            <div class="card card-stats" onclick="showDetail('stats')"><div class="icon">📊</div><div class="card-title">Stats</div><div class="card-subtitle">Overview</div><div class="progress-bar"><div class="fill" style="width:100%;background:linear-gradient(90deg,#ff6b9d,#c44dff)"></div></div></div>
        </div>
        <div class="daily-reset"><button class="reset-btn" onclick="resetToday()">↻ Reset Today</button></div>
    </div>
    <div id="detailView" class="detail-view">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <div id="detailContent"></div>
    </div>
</div>

function save(d){localStorage.setItem('dailyGrind4',JSON.stringify(d))}
function tK(s,i){return`${TODAY}_${s}_${i}`}
function sK(e,s){return`${TODAY}_set_${e}_${s}`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderDashboard(){
    const d=getData(),now=new Date();
    document.getElementById('dayName').textContent=DAYS[DOW];
    document.getElementById('currentDate').textContent=now.toLocaleDateString('no-NO',{month:'long',day:'numeric',year:'numeric'});
    updateStreak(d);

    // Schedule banner
    const sched=SCHEDULE[DOW];
    let banner=`<div class="schedule-banner"><div class="sched-title">📅 Dagens program</div><div class="sched-items">`;
    sched.items.forEach(item=>{banner+=`<div>${item}</div>`});
    banner+=`</div></div>`;
    document.getElementById('scheduleBanner').innerHTML=banner;

    let tD=0,tA=0;
    ['morning','daily','night'].forEach(s=>{
        const items=d.routines[s].items;let dn=0;
        items.forEach((_,i)=>{if(d.checked[tK(s,i)])dn++});
        const p=items.length?Math.round(dn/items.length*100):0;
        document.getElementById(`${s}Status`).textContent=`${dn}/${items.length}`;
        document.getElementById(`${s}Progress`).style.width=p+'%';
        tD+=dn;tA+=items.length;
    });
    const w=d.workouts[DOW];let wd=0,wt=0;
    if(w)w.exercises.forEach((ex,ei)=>{for(let s=0;s<ex.sets;s++){wt++;if(d.checked[sK(ei,s)])wd++}});
    document.getElementById('workoutStatus').textContent=w?w.name:'Hvile';
    document.getElementById('workoutProgress').style.width=(wt?Math.round(wd/wt*100):0)+'%';
    tD+=wd;tA+=wt;
    const g=d.goals||{short:[],long:[]};
    const allG=[...g.short,...g.long];
    const gD=allG.filter(x=>x.done).length;
    document.getElementById('goalsStatus').textContent=`${gD}/${allG.length}`;
    document.getElementById('goalsProgress').style.width=(allG.length?Math.round(gD/allG.length*100):0)+'%';
    document.getElementById('todayProgress').textContent=(tA?Math.round(tD/tA*100):0)+'%';
    document.getElementById('streakCount').textContent=d.streak||0;
    document.getElementById('totalWorkouts').textContent=Object.keys(d.workoutLog||{}).length;
}

function updateStreak(d){
    const y=new Date();y.setDate(y.getDate()-1);const ys=y.toISOString().split('T')[0];
    if(d.lastActiveDate===TODAY)return;
    d.streak=d.lastActiveDate===ys?(d.streak||0)+1:1;
    d.lastActiveDate=TODAY;save(d);
}

function showDetail(s){
    editMode=false;
    document.getElementById('dashboard').style.display='none';
    document.getElementById('detailView').classList.add('active');
    if(s==='workout'){viewingDay=DOW;renderWorkout()}
    else if(s==='goals')renderGoals();
    else if(s==='stats')renderStats();
    else renderChecklist(s);
}
function goBack(){
    document.getElementById('dashboard').style.display='block';
    document.getElementById('detailView').classList.remove('active');
    editMode=false;renderDashboard();
}

function renderChecklist(section){
    const d=getData(),r=d.routines[section],c=document.getElementById('detailContent');
    let h=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="detail-title" style="margin-bottom:0">${r.title}</h2><button class="icon-btn ${editMode?'active-edit':''}" onclick="toggleEdit('${section}')">✏️</button></div><div style="height:14px"></div>`;

    if(section==='daily'){
        const w=d.water[TODAY]||0;
        h+=`<div class="water-tracker"><div class="water-title">💧 Vann</div><div class="water-sub">Trykk for hvert glass du drikker</div><div class="water-glasses">`;
        for(let i=1;i<=8;i++)h+=`<span class="water-glass ${i<=w?'filled':''}" onclick="setWater(${i})">💧</span>`;
        h+=`</div><div class="water-count">${w} / 8 glass</div></div>`;

        const m=d.mood[TODAY]||0;
        const emojis=['😫','😕','😐','😊','🔥'];
        const emojiLabels=['Dårlig','Meh','Ok','Bra','On fire'];
        h+=`<div class="mood-tracker"><div class="mood-title">Hvordan føler du deg?</div><div class="mood-emojis">`;
        emojis.forEach((e,i)=>h+=`<span class="mood-emoji ${m===i+1?'selected':''}" onclick="setMood(${i+1})" title="${emojiLabels[i]}">${e}</span>`);
        h+=`</div></div>`;
    }

    if(section==='night'){
        const sl=d.sleep[TODAY]||{hours:'',quality:0};
        h+=`<div class="sleep-log"><div class="sleep-title">😴 Søvnlogg</div>
            <div class="sleep-row"><label>Timer</label><input type="number" min="0" max="14" step="0.5" value="${sl.hours}" placeholder="8" onchange="setSleepH(this.value)"></div>
            <div class="sleep-row"><label>Kvalitet</label><div class="sleep-stars">`;
        for(let i=1;i<=5;i++)h+=`<span class="sleep-star ${i<=sl.quality?'active':''}" onclick="setSleepQ(${i})">⭐</span>`;
        h+=`</div></div></div>`;
    }

    if(editMode){
        h+=`<div class="mode-label">✏️ Redigeringsmodus</div><div id="editList">`;
        r.items.forEach((item,i)=>{h+=`<div class="edit-item-row"><div class="edit-inputs"><input class="input-task" type="text" value="${esc(item.text)}" placeholder="Oppgave"><input class="input-time" type="text" value="${esc(item.time)}" placeholder="Tid"></div><button class="delete-item-btn" onclick="this.closest('.edit-item-row').remove()">✕</button></div>`});
        h+=`</div><button class="add-btn" onclick="addRow()">+ Legg til</button><button class="btn-save-all" onclick="saveRoutine('${section}')">Lagre</button>`;
    }else{
        if(!r.items.length)h+=`<div class="empty-state">Ingen oppgaver. Trykk ✏️!</div>`;
        h+=`<ul class="checklist">`;
        r.items.forEach((item,i)=>{
            const ck=d.checked[tK(section,i)]?'checked':'';
            h+=`<li class="${ck}" onclick="toggleCheck('${section}',${i})" id="item-${section}-${i}"><div class="checkbox">✓</div><span class="task-text">${item.text}</span><span class="task-time">${item.time}</span></li>`;
        });
        h+=`</ul>`;
    }
    c.innerHTML=h;
}

function addRow(){
    const l=document.getElementById('editList'),d=document.createElement('div');
    d.innerHTML=`<div class="edit-item-row"><div class="edit-inputs"><input class="input-task" type="text" placeholder="Oppgave"><input class="input-time" type="text" placeholder="Tid"></div><button class="delete-item-btn" onclick="this.closest('.edit-item-row').remove()">✕</button></div>`;
    l.appendChild(d.firstElementChild);l.lastElementChild.querySelector('.input-task').focus();
}
function saveRoutine(s){
    const d=getData(),rows=document.querySelectorAll('#editList .edit-item-row'),items=[];
    rows.forEach(r=>{const t=r.querySelector('.input-task').value.trim(),tm=r.querySelector('.input-time').value.trim();if(t)items.push({text:t,time:tm})});
    d.routines[s].items=items;save(d);editMode=false;renderChecklist(s);
}
function toggleEdit(s){editMode=!editMode;if(s==='workout')renderWorkout();else renderChecklist(s)}
function toggleCheck(s,i){const d=getData(),k=tK(s,i);d.checked[k]=!d.checked[k];save(d);document.getElementById(`item-${s}-${i}`).classList.toggle('checked')}

function setWater(n){const d=getData();d.water[TODAY]=d.water[TODAY]===n?n-1:n;save(d);renderChecklist('daily')}
function setMood(n){const d=getData();d.mood[TODAY]=n;save(d);renderChecklist('daily')}
function setSleepH(v){const d=getData();if(!d.sleep[TODAY])d.sleep[TODAY]={hours:0,quality:0};d.sleep[TODAY].hours=v;save(d)}
function setSleepQ(n){const d=getData();if(!d.sleep[TODAY])d.sleep[TODAY]={hours:0,quality:0};d.sleep[TODAY].quality=n;save(d);renderChecklist('night')}

function renderWorkout(){

function addEx(){

function saveWorkout(){
    const d=getData(),name=document.getElementById('wName').value.trim()||'Trening',cards=document.querySelectorAll('#exList .edit-exercise-card'),exs=[];
    cards.forEach(c=>{const n=c.querySelector('.ex-name').value.trim();if(!n)return;exs.push({name:n,muscle:c.querySelector('.ex-muscle').value.trim()||'General',sets:parseInt(c.querySelector('.ex-sets').value)||3,reps:c.querySelector('.ex-reps').value.trim()||'10'})});
    d.workouts[viewingDay]={name,exercises:exs};save(d);editMode=false;renderWorkout();
}
function switchDay(i){viewingDay=i;editMode=false;renderWorkout()}
function toggleSet(e,s,b){const d=getData(),k=sK(e,s);d.checked[k]=!d.checked[k];save(d);b.classList.toggle('done')}
function saveSet(e,s,f,v){const d=getData(),k=sK(e,s);if(!d.setData)d.setData={};if(!d.setData[k])d.setData[k]={};d.setData[k][f]=v;save(d)}
function logWorkout(){
    const d=getData(),w=d.workouts[DOW];if(!w)return;let det=[];
    w.exercises.forEach((ex,ei)=>{let ss=[];for(let s=0;s<ex.sets;s++){const sd=d.setData?.[sK(ei,s)];if(sd&&(sd.weight||sd.reps))ss.push(`${sd.weight||'?'}kg×${sd.reps||'?'}`)}if(ss.length)det.push(`${ex.name}: ${ss.join(', ')}`)});
    if(!d.workoutLog)d.workoutLog={};
    d.workoutLog[TODAY]=det.length?det.join(' | '):`${w.name} — fullført`;save(d);alert('Trening logget! 💪');renderWorkout();
}

    h+=`</div>`;

    h+=`<div class="stat-card"><h3>💧 Vann (siste 7 dager)</h3>`;
    last7.forEach(dt=>{const w=d.water?.[dt]||0;h+=`<div class="stat-row"><span class="stat-date">${fmtDate(dt)}</span><span class="stat-val">${w}/8 glass</span></div>`});
    h+=`</div>`;

    const mE=['','😫','😕','😐','😊','🔥'];
    h+=`<div class="stat-card"><h3>😤 Humør (siste 7 dager)</h3>`;
    last7.forEach(dt=>{const m=d.mood?.[dt]||0;h+=`<div class="stat-row"><span class="stat-date">${fmtDate(dt)}</span><span class="stat-val">${m?mE[m]:'—'}</span></div>`});

    h+=`<div class="stat-card"><h3>🏆 Personal Records</h3>`;
    const prs=d.prs||[];
    if(!prs.length)h+=`<p style="color:#444;font-size:13px">Ingen PRs ennå.</p>`;
    prs.forEach(pr=>{h+=`<div class="stat-row"><span class="stat-date">${esc(pr.exercise)}</span><span class="stat-val">${pr.weight} kg</span></div>`});
    h+=`</div>`;

    c.innerHTML=h;
}

function getLast7(){const d=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);d.push(x.toISOString().split('T')[0])}return d}
function fmtDate(dt){const d=new Date(dt+'T12:00:00');return d.toLocaleDateString('no-NO',{weekday:'short',day:'numeric',month:'short'})}
function calcAvg(o){const v=Object.values(o||{}).filter(x=>x>0);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'—'}
function calcAvgSleep(o){const v=Object.values(o||{}).map(x=>parseFloat(x.hours)).filter(x=>x>0);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1)+'h':'—'}

function resetToday(){
    if(!confirm('Nullstille dagens sjekklister?'))return;
    const d=getData();
    Object.keys(d.checked).forEach(k=>{if(k.startsWith(TODAY))delete d.checked[k]});
    if(d.setData)Object.keys(d.setData).forEach(k=>{if(k.startsWith(TODAY))delete d.setData[k]});
    save(d);renderDashboard();
}

renderDashboard();
</script>
